services:
  - type: web
    name: complaint-ai-backend
    env: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: complaint-ai-db
          property: connectionString
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: complaint-ai-db
    plan: free
    databaseName: complaints
    user: complaints_user
